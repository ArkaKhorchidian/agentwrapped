[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentwrapped"
version = "0.1.0"
description = "Spotify Wrapped for your AI coding agents: your year with Claude Code, Codex and Gemini CLI, with a shareable card. Reads local logs only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/agentwrapped/fonts/OFL.txt"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "pillow>=9.2", "pyfiglet>=0.8"]
keywords = ["wrapped", "year-in-review", "ai", "claude-code", "codex", "gemini-cli", "llm", "developer", "stats", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agentwrapped = "agentwrapped.cli:run"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/agentwrapped"
Issues = "https://github.com/ArkaKhorchidian/agentwrapped/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwrapped"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
